<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="ParseUI is the design system and React UI library for ParseLab apps: tokens, components, blocks and dashboard examples.">
<meta property="og:title" content="ParseUI — Design system by ParseLab">
<meta property="og:description" content="Tokens, React components, blocks and dashboard examples for every ParseLab app.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFFFFF">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>ParseUI — Design system by ParseLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, .scope-light{
  --bg:#FFFFFF; --bg-subtle:#F8F8FA; --bg-muted:#F1F1F4; --bg-inset:#EBEBEF;
  --border:#E7E7EC; --border-strong:#D6D6DD;
  --text:#14141B; --text-2:#51515E; --text-3:#8B8B98;
  --success:#12915A; --success-soft:#E7F6EE; --warning:#C27A04; --warning-soft:#FDF3E1;
  --danger:#DC3E42; --danger-soft:#FDECEC; --info:#2F6FEB; --info-soft:#EAF1FE;
  --sh-xs:0 1px 2px rgba(20,20,27,.05);
  --sh-sm:0 1px 3px rgba(20,20,27,.08),0 1px 2px rgba(20,20,27,.04);
  --sh-md:0 4px 10px -2px rgba(20,20,27,.08),0 2px 4px -2px rgba(20,20,27,.05);
  --sh-lg:0 14px 28px -8px rgba(20,20,27,.14),0 4px 8px -4px rgba(20,20,27,.06);
  --sh-xl:0 24px 48px -12px rgba(20,20,27,.22);
  --code-bg:#FAFAFB; --grid-dot:#E2E2E8; --logo-word:#696969;
  color-scheme:light;
}
:root[data-theme="dark"], .scope-dark{
  --bg:#0F0F14; --bg-subtle:#15151C; --bg-muted:#1C1C24; --bg-inset:#24242E;
  --border:#26262F; --border-strong:#34343F;
  --text:#EDEDF2; --text-2:#A6A6B3; --text-3:#6E6E7C;
  --success:#3DC98A; --success-soft:#12291F; --warning:#F0B34A; --warning-soft:#2C2311;
  --danger:#F26B6E; --danger-soft:#2E1517; --info:#6B9CF7; --info-soft:#141F35;
  --sh-xs:0 1px 2px rgba(0,0,0,.4); --sh-sm:0 1px 3px rgba(0,0,0,.5);
  --sh-md:0 4px 12px rgba(0,0,0,.5); --sh-lg:0 14px 30px rgba(0,0,0,.55); --sh-xl:0 24px 50px rgba(0,0,0,.6);
  --code-bg:#13131A; --grid-dot:#23232C; --logo-word:#FFFFFF;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F14; --bg-subtle:#15151C; --bg-muted:#1C1C24; --bg-inset:#24242E;
    --border:#26262F; --border-strong:#34343F;
    --text:#EDEDF2; --text-2:#A6A6B3; --text-3:#6E6E7C;
    --success:#3DC98A; --success-soft:#12291F; --warning:#F0B34A; --warning-soft:#2C2311;
    --danger:#F26B6E; --danger-soft:#2E1517; --info:#6B9CF7; --info-soft:#141F35;
    --sh-xs:0 1px 2px rgba(0,0,0,.4); --sh-sm:0 1px 3px rgba(0,0,0,.5);
    --sh-md:0 4px 12px rgba(0,0,0,.5); --sh-lg:0 14px 30px rgba(0,0,0,.55); --sh-xl:0 24px 50px rgba(0,0,0,.6);
    --code-bg:#13131A; --grid-dot:#23232C; --logo-word:#FFFFFF; color-scheme:dark;
  }
}
/* derived tokens: recomputed in every scope */
:root, .scope-light, .scope-dark{
  --p:var(--brand, var(--text));
  --p-fg:var(--brand-fg, var(--bg));
  --p-hover:color-mix(in oklab, var(--p) 86%, var(--text));
  --p-soft:color-mix(in oklab, var(--p) 11%, var(--bg));
  --p-soft-2:color-mix(in oklab, var(--p) 20%, var(--bg));
  --p-text:color-mix(in oklab, var(--p) 82%, var(--text));
  --ring:color-mix(in oklab, var(--p) 40%, transparent);
  --r:var(--radius, 8px);
  --r-sm:calc(var(--r) * .75);
  --r-lg:calc(var(--r) * 1.5);
  --r-xl:calc(var(--r) * 2);
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root{ --brand:#2488FF; --brand-fg:#fff; --radius:8px; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font:400 15px/1.6 var(--font);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
a{ color:inherit; text-decoration:none; }
img,svg{ max-width:100%; }
button{ font:inherit; color:inherit; }
code,kbd,pre{ font-family:var(--mono); }
::selection{ background:var(--p-soft-2); }
.ico{ width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.ico-lg{ width:20px; height:20px; }
:focus-visible{ outline:2px solid var(--p); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* ============ SITE CHROME ============ */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:40; height:60px; display:flex; align-items:center; gap:20px;
  padding:0 20px; background:color-mix(in oklab, var(--bg) 86%, transparent); backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px); border-bottom:1px solid var(--border); }
.logo{ display:flex; align-items:center; gap:9px; font-weight:600; font-size:16px; letter-spacing:-.01em; }
.logo-full,.logo-tile{ display:block; flex:none; max-width:none; } .lw{ fill:var(--logo-word,#696969); transition:fill .2s; }
.ver{ font:500 11px/1 var(--mono); color:var(--text-2); border:1px solid var(--border); padding:4px 6px; border-radius:6px; }
.nav-links{ display:flex; gap:2px; }
.nav-links a{ padding:6px 10px; border-radius:7px; font-size:14px; color:var(--text-2); font-weight:500; }
.nav-links a:hover{ color:var(--text); background:var(--bg-muted); }
.nav-links a.on{ color:var(--text); }
.top-right{ margin-left:auto; display:flex; align-items:center; gap:6px; }
.search-btn{ display:flex; align-items:center; gap:8px; height:34px; width:240px; padding:0 8px 0 10px; border:1px solid var(--border);
  border-radius:9px; background:var(--bg-subtle); color:var(--text-3); font-size:13.5px; cursor:pointer; }
.search-btn:hover{ border-color:var(--border-strong); }
.search-btn .kbd{ margin-left:auto; }
.kbd{ font:500 11px/1 var(--mono); padding:4px 5px; border-radius:5px; border:1px solid var(--border); background:var(--bg); color:var(--text-2); box-shadow:0 1px 0 var(--border); }
.icon-btn{ width:34px; height:34px; display:grid; place-items:center; border-radius:8px; border:0; background:none; color:var(--text-2); cursor:pointer; }
.icon-btn:hover{ background:var(--bg-muted); color:var(--text); }
.menu-btn{ display:none; }

.layout{ display:grid; grid-template-columns:260px minmax(0,1fr) 220px; max-width:1480px; margin:0 auto; }
.layout.no-toc{ grid-template-columns:260px minmax(0,1fr); }
.sidebar{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 60px); height:calc(100vh - 60px); overflow-y:auto; padding:22px 14px 40px 20px; border-right:1px solid var(--border); }
.sb-group{ margin-bottom:22px; }
.sb-title{ font-size:12.5px; font-weight:600; color:var(--text); padding:0 10px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.sb-title .count{ font:500 11px var(--mono); color:var(--text-3); margin-left:auto; }
.sb-link{ display:flex; align-items:center; gap:8px; padding:5px 10px; border-radius:7px; font-size:14px; color:var(--text-2); }
.sb-link:hover{ color:var(--text); background:var(--bg-muted); }
.sb-link.on{ color:var(--p-text); background:var(--p-soft); font-weight:500; }
.sb-group + .sb-group{ border-top:1px dashed var(--border-strong); padding-top:18px; }
.sb-group.nested .sb-link{ margin-left:10px; padding-left:14px; border-radius:0 7px 7px 0; border-left:1px solid var(--border); }
.sb-group.nested .sb-link.on{ border-left:2px solid var(--p); padding-left:13px; background:transparent; }
.sb-group.nested .sb-link.on:hover{ background:var(--bg-muted); }
.sb-link.soon{ color:var(--text-3); pointer-events:none; }
.sb-link .tag{ margin-left:auto; }
.tag{ font:500 10.5px/1 var(--font); padding:3px 6px; border-radius:5px; background:var(--bg-muted); color:var(--text-3); }
.tag.new{ background:var(--p-soft); color:var(--p-text); }
.tag.pro{ background:var(--text); color:var(--bg); }
.tag.free{ background:var(--success-soft); color:var(--success); }

.main{ min-width:0; padding:36px 56px 90px; }
.doc{ max-width:800px; margin:0 auto; }
.crumbs{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-3); margin-bottom:14px; }
.crumbs .ico{ width:14px; height:14px; }
.eyebrow{ font-size:13px; font-weight:500; color:var(--p-text); margin-bottom:8px; }
.doc .meta-row{ padding-bottom:22px; margin-bottom:26px; border-bottom:1px dashed var(--border-strong); }
.doc h1 .muted{ color:var(--text-3); }
.doc h1{ font-size:32px; line-height:1.2; letter-spacing:-.025em; font-weight:600; margin:0 0 10px; }
.doc .lead{ font-size:17px; color:var(--text-2); margin:0 0 22px; max-width:640px; }
.doc h2{ font-size:21px; letter-spacing:-.015em; font-weight:600; margin:52px 0 12px; padding-top:4px; }
.doc h3{ font-size:16px; font-weight:600; margin:32px 0 8px; }
.doc p{ color:var(--text-2); margin:0 0 14px; max-width:680px; }
.doc p code, .doc li code, .props code, .inline-code{ font-size:.86em; padding:2px 5px; border-radius:5px; background:var(--bg-muted); color:var(--text); border:1px solid var(--border); }
.doc ul{ color:var(--text-2); padding-left:20px; }
.doc li{ margin:4px 0; }
.meta-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.chip-link{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:1px solid var(--border); border-radius:7px; font-size:13px; color:var(--text-2); background:var(--bg); }
.chip-link:hover{ border-color:var(--border-strong); color:var(--text); }
.chip-link .ico{ width:14px; height:14px; }

.toc{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 60px); height:calc(100vh - 60px); overflow-y:auto; padding:40px 20px; }
.toc-title{ display:flex; align-items:center; gap:6px; font:600 11px/1 var(--font); letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:12px; }
.toc-title .ico{ width:14px; height:14px; }
.toc a.sub{ padding-left:24px; font-size:12.5px; }
.toc a{ display:block; font-size:13px; color:var(--text-3); padding:4px 0 4px 12px; border-left:1px solid var(--border); }
.toc a:hover{ color:var(--text); }
.toc a.on{ color:var(--p-text); border-left-color:var(--p); }
.toc-card{ margin-top:24px; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--bg-subtle); font-size:13px; color:var(--text-2); }
.toc-card b{ color:var(--text); display:block; margin-bottom:4px; font-weight:600; }

/* preview + code blocks */
.demo{ border:1px solid var(--border); border-radius:12px; overflow:hidden; margin:14px 0 8px; background:var(--bg); }
.demo-bar{ display:flex; align-items:center; gap:4px; padding:6px; border-bottom:1px solid var(--border); background:var(--bg-subtle); }
.seg{ display:inline-flex; padding:2px; background:var(--bg-muted); border-radius:8px; gap:2px; }
.seg button{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; background:none; padding:4px 10px; font-size:13px; font-weight:500; border-radius:6px; color:var(--text-2); cursor:pointer; }
.seg button:has(> .ico:only-child){ width:30px; height:28px; padding:0; }
.seg button.on{ background:var(--bg); color:var(--text); box-shadow:var(--sh-xs); }
.demo-bar .spacer{ flex:1; }
.preview{ position:relative; min-height:200px; padding:44px 28px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px;
  background:var(--bg); color:var(--text);
  background-image:radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size:16px 16px; }
.preview.left{ justify-content:flex-start; }
.preview.col{ flex-direction:column; }
.preview.flush{ padding:0; display:block; background-image:none; }
.codewrap{ position:relative; }
.codewrap.lined{ display:flex; background:var(--code-bg); }
.codewrap.lined pre.code:not(.gutter){ flex:1; min-width:0; padding-left:14px; }
pre.code.gutter{ flex:none; padding-right:0; text-align:right; color:var(--text-3); opacity:.7; user-select:none; overflow:visible; min-width:44px; }
pre.code{ margin:0; padding:18px 20px; overflow-x:auto; background:var(--code-bg); font-size:13px; line-height:1.7; color:var(--text); tab-size:2; }
.demo pre.code{ max-height:460px; }
.copy{ position:absolute; top:10px; right:10px; width:30px; height:30px; display:grid; place-items:center; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text-2); cursor:pointer; }
.copy:hover{ color:var(--text); border-color:var(--border-strong); }
.copy .ico{ width:14px; height:14px; }
.cblock{ border:1px solid var(--border); border-radius:12px; overflow:hidden; margin:12px 0 18px; }
.cblock-head{ display:flex; align-items:center; gap:8px; padding:0 8px 0 14px; height:42px; border-bottom:1px solid var(--border); background:var(--bg-subtle); font:500 12.5px var(--mono); color:var(--text-2); }
.cblock-head .seg{ margin-left:auto; }
.tk-k{ color:#C0359B; } .tk-s{ color:#1F8A4C; } .tk-t{ color:#2F5FD0; } .tk-a{ color:#9A5B00; } .tk-c{ color:var(--text-3); font-style:italic; } .tk-n{ color:#B5470E; }
[data-theme="dark"] .tk-k,.scope-dark .tk-k{ color:#F28FD4; } [data-theme="dark"] .tk-s{ color:#7EDC9E; } [data-theme="dark"] .tk-t{ color:#8DB2FF; } [data-theme="dark"] .tk-a{ color:#F2C06B; } [data-theme="dark"] .tk-n{ color:#FF9E6B; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tk-k{ color:#F28FD4; } :root:not([data-theme="light"]) .tk-s{ color:#7EDC9E; } :root:not([data-theme="light"]) .tk-t{ color:#8DB2FF; } :root:not([data-theme="light"]) .tk-a{ color:#F2C06B; } :root:not([data-theme="light"]) .tk-n{ color:#FF9E6B; } }

.steps{ counter-reset:st; margin:18px 0; }
.step{ position:relative; padding:0 0 26px 44px; border-left:1px solid var(--border); margin-left:14px; }
.step:last-child{ border-left-color:transparent; }
.step::before{ counter-increment:st; content:counter(st); position:absolute; left:-15px; top:-2px; width:29px; height:29px; border-radius:50%;
  display:grid; place-items:center; background:var(--bg); border:1px solid var(--border-strong); font:600 13px var(--font); color:var(--text); }
.step h4{ margin:2px 0 6px; font-size:15px; font-weight:600; }
.step p{ margin-bottom:8px; }

.props-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; margin:12px 0; }
table.props{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px; }
.props th{ text-align:left; font-weight:500; color:var(--text-3); padding:10px 14px; background:var(--bg-subtle); border-bottom:1px solid var(--border); font-size:12.5px; }
.props td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--text-2); }
.props tr:last-child td{ border-bottom:0; }
.props td:first-child code{ color:var(--p-text); background:var(--p-soft); border-color:transparent; }
.props td.type{ font:12.5px var(--mono); color:var(--text-2); }

.callout{ display:flex; gap:12px; padding:14px 16px; border-radius:12px; background:var(--bg-subtle); border:1px solid var(--border); margin:18px 0; font-size:14px; color:var(--text-2); }
.callout .ico{ margin-top:3px; color:var(--p-text); }
.callout b{ color:var(--text); font-weight:600; }

.pager{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:64px; }
.pager a{ padding:14px 16px; border:1px solid var(--border); border-radius:12px; font-size:13px; color:var(--text-3); }
.pager a:hover{ border-color:var(--border-strong); }
.pager a b{ display:block; font-size:15px; color:var(--text); font-weight:500; margin-top:2px; }
.pager a.next{ text-align:right; grid-column:2; }

.card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin:18px 0; }
.ccard{ display:block; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg); transition:border-color .15s, box-shadow .15s; }
.ccard:hover{ border-color:var(--border-strong); box-shadow:var(--sh-md); }
.ccard-thumb{ height:128px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; padding:14px; background:var(--bg-subtle); border-bottom:1px solid var(--border); pointer-events:none; overflow:hidden; }
.ccard-body{ padding:12px 14px; display:flex; align-items:center; gap:8px; }
.ccard-body b{ font-weight:500; font-size:14px; }
.ccard-body span{ font-size:12.5px; color:var(--text-3); margin-left:auto; }
.ccard-thumb{ --gl:color-mix(in oklab, var(--border) 60%, transparent); background:linear-gradient(var(--gl),var(--gl)) 0 24%/100% 1px no-repeat, linear-gradient(var(--gl),var(--gl)) 0 76%/100% 1px no-repeat,linear-gradient(var(--gl),var(--gl)) 14% 0/1px 100% no-repeat, linear-gradient(var(--gl),var(--gl)) 86% 0/1px 100% no-repeat, var(--bg-subtle); }
.ccard-body{ flex-wrap:wrap; } .ccard-body small{ flex-basis:100%; font-size:12.5px; color:var(--text-3); margin-top:-4px; }
/* ============ PARSEUI COMPONENTS (pu-*) ============ */
.pu-btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; padding:0 14px; border-radius:var(--r);
  font:500 14px/1 var(--font); letter-spacing:-.005em; border:1px solid transparent; cursor:pointer; white-space:nowrap; text-decoration:none;
  transition:background-color .15s, border-color .15s, box-shadow .15s, color .15s; }
.pu-btn:focus-visible{ outline:none; box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--p); }
.pu-btn.primary{ background:var(--p); color:var(--p-fg); box-shadow:var(--sh-xs), inset 0 1px 0 rgba(255,255,255,.14); }
.pu-btn.primary:hover{ background:var(--p-hover); }
.pu-btn.secondary{ background:var(--bg); color:var(--text); border-color:var(--border-strong); box-shadow:var(--sh-xs); }
.pu-btn.secondary:hover{ background:var(--bg-subtle); }
.pu-btn.soft{ background:var(--p-soft); color:var(--p-text); }
.pu-btn.soft:hover{ background:var(--p-soft-2); }
.pu-btn.ghost{ background:transparent; color:var(--text-2); }
.pu-btn.ghost:hover{ background:var(--bg-muted); color:var(--text); }
.pu-btn.danger{ background:var(--danger); color:#fff; box-shadow:var(--sh-xs); }
.pu-btn.danger:hover{ background:color-mix(in oklab, var(--danger) 88%, #000); }
.pu-btn.link{ height:auto; padding:0; background:none; color:var(--p-text); }
.pu-btn.link:hover{ text-decoration:underline; text-underline-offset:3px; }
.pu-btn.xs{ height:28px; padding:0 10px; font-size:13px; border-radius:var(--r-sm); }
.pu-btn.sm{ height:32px; padding:0 12px; font-size:13.5px; }
.pu-btn.lg{ height:44px; padding:0 18px; font-size:15px; }
.pu-btn.icon{ width:36px; padding:0; } .pu-btn.icon.sm{ width:32px; } .pu-btn.icon.xs{ width:28px; } .pu-btn.icon.lg{ width:44px; }
.pu-btn.full{ width:100%; }
.pu-btn[disabled]{ opacity:.5; cursor:not-allowed; pointer-events:none; }
.spin{ animation:spin .8s linear infinite; } @keyframes spin{ to{ transform:rotate(360deg); } }
.pu-group{ display:inline-flex; }
.pu-group .pu-btn{ border-radius:0; margin-left:-1px; box-shadow:none; }
.pu-group .pu-btn:first-child{ border-radius:var(--r) 0 0 var(--r); margin-left:0; }
.pu-group .pu-btn:last-child{ border-radius:0 var(--r) var(--r) 0; }
.pu-group .pu-btn.on{ background:var(--bg-muted); }

.pu-badge{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:calc(var(--r) * .75); font:500 12px/1 var(--font); white-space:nowrap; }
.pu-badge.round{ border-radius:999px; }
.pu-badge.gray{ background:var(--bg-muted); color:var(--text-2); }
.pu-badge.brand{ background:var(--p-soft); color:var(--p-text); }
.pu-badge.success{ background:var(--success-soft); color:var(--success); }

  const n=src.split('\n').length, gut=n>3?`<pre class="code gutter" aria-hidden="true">${Array.from({length:n},(_,i)=>i+1).join('\n')}</pre>`:'';
  return `<div class="cblock">${title?`<div class="cblock-head">${esc(title)}</div>`:''}<div class="codewrap ${gut?'lined':''}">${gut}<pre class="code">${hl(src,lang)}</pre><button class="copy" data-copy="${id}" aria-label="Copy code">${I('copy')}</button></div></div>`; };

/* ---------- theme state ---------- */
const BRANDS=[
  {id:'parse',name:'Parse blue',c:'#2488FF'},{id:'violet',name:'Violet',c:'#5B3DF5'},{id:'emerald',name:'Emerald',c:'#0E9F6E'},
  {id:'orange',name:'Orange',c:'#EA580C'},{id:'rose',name:'Rose',c:'#E11D48'},{id:'neutral',name:'Neutral',c:null}];
const store={ get(k,d){ try{ const v=localStorage.getItem('parseui:'+k); return v===null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('parseui:'+k,v); }catch(e){} } };
const state={ brand:store.get('brand','parse'), radius:store.get('radius','8'), theme:store.get('theme','system') };
function applyTheme(){
  const b=BRANDS.find(x=>x.id===state.brand)||BRANDS[0], s=document.documentElement.style;
  if(b.c){ s.setProperty('--brand',b.c); s.setProperty('--brand-fg','#fff'); } else { s.setProperty('--brand','initial'); s.setProperty('--brand-fg','initial'); }
  s.setProperty('--radius',state.radius+'px');
  if(state.theme==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',state.theme);
  document.getElementById('themeBtn').innerHTML=I(isDark()?'sun':'moon','ico-lg');
  document.querySelectorAll('[data-brand]').forEach(el=>el.classList.toggle('on',el.dataset.brand===state.brand));
  document.querySelectorAll('[data-radius]').forEach(el=>el.classList.toggle('on',el.dataset.radius===state.radius));
  document.querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('on',el.dataset.mode===state.theme));
  document.querySelectorAll('.brand-ramp').forEach(renderRamp);
}
const isDark=()=>state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
const swatches=(cls='')=>`<div class="swatches ${cls}">${BRANDS.map(b=>`<button class="sw" data-brand="${b.id}" title="${b.name}" aria-label="${b.name} brand color" style="background:${b.c||'var(--text)'}"></button>`).join('')}</div>`;

/* ---------- avatar helper ---------- */
const AV_COLORS=['#5B3DF5','#0E9F6E','#EA580C','#2563EB','#DB2777','#0891B2','#7C3AED','#CA8A04'];
const av=(name,cls='',st=false)=>{ const ini=name.split(' ').map(w=>w[0]).slice(0,2).join(''); let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))%997;
  return `<span class="pu-avatar ${cls}" style="background:${AV_COLORS[h%AV_COLORS.length]}" title="${name}">${ini}${st?'<i class="st"></i>':''}</span>`; };

const REV=[31,34,29,38,41,37,44,48,42,51,49,55,53,58,62,57,61,66,63,70,68,74,71,77,82,79,85,83,88,92];
const PREV=[28,30,27,31,33,32,35,36,34,38,37,40,39,41,43,42,44,46,45,47,46,49,48,50,52,51,53,52,55,56];
function lineChart(w=640,h=220){ const min=20,max=100,pad=8,
  pts=a=>a.map((v,i)=>[pad+i*(w-pad*2)/(a.length-1), h-pad-((v-min)/(max-min))*(h-pad*2)]),
  d=a=>pts(a).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const cur=d(REV), last=pts(REV).at(-1), gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Revenue over the last 30 days, trending up">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--p);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--p);stop-opacity:0"/></linearGradient></defs>
  ${[.25,.5,.75].map(f=>`<line x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" style="stroke:var(--border)" stroke-dasharray="3 4"/>`).join('')}
  <path d="${d(PREV)}" fill="none" style="stroke:var(--text-3)" stroke-width="1.6" stroke-dasharray="4 4"/>
  <path d="${cur} L${w-pad} ${h} L${pad} ${h}Z" fill="url(#${gid})"/>
  <path d="${cur}" fill="none" style="stroke:var(--p)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${last[0]}" cy="${last[1]}" r="4.5" style="fill:var(--bg);stroke:var(--p)" stroke-width="2.2"/></svg>`; }
const bars=(a)=>`<svg class="spark" viewBox="0 0 120 36" preserveAspectRatio="none" style="height:36px" aria-hidden="true">${a.map((v,i)=>`<rect x="${i*10+1}" y="${36-v*.36}" width="7" height="${v*.36}" rx="1.5" style="fill:${i===a.length-1?'var(--p)':'var(--p-soft-2)'}"/>`).join('')}</svg>`;

 {id:'welcome',cat:'Onboarding',t:'Welcome screen',d:'First screen after install: what the app does and one clear way to start.',free:true,html:`<div class="pu-card blk-welcome">${logoTile('w',48)}<h4>Welcome to Printly</h4><p class="blk-lead">Let shoppers personalise your products and send print-ready files to production without leaving Shopify.</p><ul class="blk-vals">${[['layers','Design on real mockups','Shoppers place artwork on 40+ print-ready products.'],['zap','Print files, automatically','Every paid order sends a production file to your printer.'],['shield','Checked before print','Low-resolution artwork is flagged before checkout.']].map(v=>`<li><span class="ic">${I(v[0])}</span><div><b>${v[1]}</b><span>${v[2]}</span></div></li>`).join('')}</ul><div class="blk-welcome-acts"><button type="button" class="pu-btn primary full">Get started</button><button type="button" class="pu-btn secondary full">Watch a 2-minute tour</button></div><p class="blk-note">Takes about 5 minutes</p></div>`,

 {id:'setup-guide',cat:'Onboarding',t:'Setup guide',d:'Checklist that walks a new merchant through the first tasks after install. One task is open at a time.',free:true,html:`<div class="pu-card blk-setup" data-setup><div data-setup-body><div class="blk-setup-h"><div><h4>Set up Printly</h4><p data-setup-count>2 of 5 tasks complete</p></div><button type="button" class="pu-btn ghost icon sm" data-setup-x aria-label="Dismiss setup guide">${I('x')}</button></div><div class="pu-progress sm" role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="2"><i style="width:40%"></i></div><ol class="blk-tasks">${[['Install the theme block','The Printly block is live on your product page.',1],['Choose a product template','Shoppers will personalise the Heavyweight tee.',1],['Upload your first design','Add a PNG or SVG. Printly checks resolution and bleed before anything goes to print.',0,'Upload design',1],['Set print areas','Mark where artwork can go on the front, back and sleeves.',0,'Set print areas'],['Publish to your store','Turn on personalisation so shoppers can start designing.',0,'Publish']].map(s=>`<li class="blk-task${s[2]?' done':''}${s[4]?' open':''}"><button type="button" class="blk-task-t" data-task-t aria-expanded="${s[4]?'true':'false'}"><span class="blk-task-ic">${s[2]?I('checkC')+'<span class="blk-sr">Completed: </span>':'<i></i>'}</span>${s[0]}</button><div class="blk-task-b${s[4]?'':' hidden'}"><p>${s[1]}</p>${s[2]?'':`<div class="blk-task-acts"><button type="button" class="pu-btn primary sm" data-task-do>${s[3]}</button><button type="button" class="pu-btn ghost sm" data-task-skip>Skip for now</button></div>`}</div></li>`).join('')}</ol></div><div class="blk-setup-min hidden" data-setup-min><span>Setup guide hidden. You can finish setting up Printly any time.</span><button type="button" class="pu-btn secondary sm" data-setup-show>Show guide</button></div></div>`,
  code:`<SetupGuide title="Set up Printly" onDismiss={() => setGuideHidden(true)}>
  <SetupTask title="Install the theme block" complete />

</SetupGuide>`},
 {id:'page-header',cat:'App pages',t:'Page header',d:'Top of an index page: breadcrumb, title with count, primary actions and status tabs.',free:true,html:`<div class="blk-ph" data-tabs><nav class="pu-crumb" aria-label="Breadcrumb"><a href="javascript:void 0">Lumen Prints</a>${I('chevR')}<span class="cur" aria-current="page">Products</span></nav><div class="blk-ph-row"><div class="blk-ph-title"><h3>Products <span class="pu-badge gray round">128</span></h3><p>Everything shoppers can personalise with Printly.</p></div><div class="blk-ph-acts"><button type="button" class="pu-btn secondary">${I('download')}Export</button><button type="button" class="pu-btn primary">${I('plus')}Add product</button></div></div><div class="pu-tabs" role="tablist" aria-label="Product status">${['All','Active','Draft','Archived'].map((n,i)=>`<button type="button" role="tab" aria-selected="${i?'false':'true'}" tabindex="${i?-1:0}" class="${i?'':'on'}" data-i="${i}">${n}</button>`).join('')}</div>${[['all','128 products'],['active','96 active products'],['draft','24 draft products'],['archived','8 archived products']].map((p,i)=>`<p class="blk-ph-note${i?' hidden':''}" data-p="${i}">Showing ${p[1]}</p>`).join('')}</div>`,

</PageHeader>`},
 {id:'resource-list',cat:'App pages',t:'Resource list',d:'Filterable, sortable product table with row selection and bulk actions.',html:`<div class="pu-card blk-rl" data-rl><div class="blk-rl-bar" data-rl-tools><div class="pu-input sm blk-rl-q">${I('search')}<input type="search" data-rl-q placeholder="Search products" aria-label="Search products" autocomplete="off"></div><span class="blk-chip" data-rl-chip>Status: Active<button type="button" data-rl-unchip aria-label="Remove filter Status: Active">${I('x')}</button></span><button type="button" class="pu-btn ghost sm">${I('plus')}Add filter</button><select class="pu-select sm blk-rl-sort" data-rl-sort aria-label="Sort products"><option value="name">Name A–Z</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="inv">Inventory: lowest first</option></select></div><div class="blk-rl-bar blk-rl-bulk hidden" data-rl-bulk role="region" aria-label="Bulk actions"><b data-rl-count>0 selected</b><button type="button" class="pu-btn secondary sm">${I('pen')}Edit</button><button type="button" class="pu-btn secondary sm" data-rl-archive>Archive</button><button type="button" class="pu-btn danger sm" data-rl-delete>${I('trash')}Delete</button></div><span class="blk-sr" aria-live="polite" data-rl-live></span><div class="pu-table-wrap"><table class="pu-table"><thead><tr><th class="blk-rl-cb"><label class="pu-check"><input type="checkbox" data-rl-all aria-label="Select all products"></label></th><th>Product</th><th>Status</th><th>Inventory</th><th class="num">Price</th></tr></thead><tbody>${[['Heavyweight tee','active',142,32,'layers','p'],['Canvas tote','active',88,24,'tag','success'],['Ceramic mug, 11 oz','active',12,18,'box','warning'],['Framed poster, A3','active',36,45,'square','info'],['Organic hoodie','active',0,58,'star','danger'],['Phone case','active',64,22,'grid','p'],['Sticker sheet','draft',500,6,'pen','info'],['Holiday card pack','archived',0,14,'mail','warning']].sort((a,b)=>a[0].localeCompare(b[0])).map(r=>`<tr data-row data-name="${r[0]}" data-status="${r[1]}" data-price="${r[3]}" data-inv="${r[2]}"${r[1]==='active'?'':' class="hidden"'}><td class="blk-rl-cb"><label class="pu-check"><input type="checkbox" aria-label="Select ${r[0]}"></label></td><td><div class="pu-person"><span class="prod-thumb" style="background:var(--${r[5]}-soft);color:var(--${r[5]==='p'?'p-text':r[5]})">${I(r[4])}</span><b>${r[0]}</b></div></td><td>${{active:'<span class="pu-badge success round"><i class="dot"></i>Active</span>',draft:'<span class="pu-badge info round"><i class="dot"></i>Draft</span>',archived:'<span class="pu-badge gray round"><i class="dot"></i>Archived</span>'}[r[1]]}</td><td>${r[2]===0?`<span class="blk-inv out">${I('xC')}Out of stock</span>`:r[2]<20?`<span class="blk-inv low">${I('alert')}Low stock, ${r[2]} left</span>`:`${r[2]} in stock`}</td><td class="num">$${r[3].toFixed(2)}</td></tr>`).join('')}<tr class="hidden" data-rl-empty><td colspan="5" class="blk-rl-empty">No products match your search and filters.</td></tr></tbody></table></div></div>`,
  code:`<ResourceList
  resourceName={{ singular: "product", plural: "products" }}
  items={products}
  filterControl={
    <Filters
      queryValue={query}
      onQueryChange={setQuery}
      appliedFilters={[{ key: "status", label: "Status: Active", onRemove: clearStatus }]}
    />
  }
  sortOptions={[
    { label: "Name A–Z", value: "title asc" },
    { label: "Price: low to high", value: "price asc" },
    { label: "Price: high to low", value: "price desc" },
    { label: "Inventory: lowest first", value: "inventory asc" },
  ]}
  bulkActions={[
    { content: "Edit", onAction: editSelected },
    { content: "Archive", onAction: archiveSelected },
    { content: "Delete", destructive: true, onAction: deleteSelected },
  ]}
  columns={["Product", "Status", "Inventory", { title: "Price", align: "end" }]}
  renderRow={(product) => (
    <ResourceRow id={product.id} media={<Thumbnail src={product.image} alt="" />} title={product.title}>
      <Badge tone={statusTone[product.status]} dot>{product.status}</Badge>
      <InventoryCell quantity={product.inventory} lowAt={20} />
      <Price amount={product.price} currency="USD" />
    </ResourceRow>
  )}
/>`},
 {id:'settings-section',cat:'App pages',t:'Settings section',d:'Annotated settings layout: what the section is for on the left, the fields on the right.',free:true,html:`<div class="blk-set"><div class="blk-set-d"><h4>Store details</h4><p>Used on packing slips, invoices and the emails Printly sends to shoppers.</p></div><form class="pu-card" data-blk-form="Store details saved"><div class="pu-card-b blk-set-f"><div class="pu-field"><label class="pu-label" for="blk-ss-name">Store name</label><div class="pu-input"><input id="blk-ss-name" value="Lumen Prints" autocomplete="organization"></div></div><div class="pu-field"><label class="pu-label" for="blk-ss-email">Contact email</label><div class="pu-input">${I('mail')}<input id="blk-ss-email" type="email" value="hello@lumenprints.com" autocomplete="email" aria-describedby="blk-ss-email-h"></div><span class="pu-hint" id="blk-ss-email-h">Shoppers reply to this address. It never appears on your storefront.</span></div><div class="pu-field"><label class="pu-label" for="blk-ss-cur">Currency</label><select class="pu-select" id="blk-ss-cur"><option value="USD" selected>USD, US dollar</option><option value="EUR">EUR, Euro</option><option value="GBP">GBP, British pound</option><option value="CAD">CAD, Canadian dollar</option><option value="AUD">AUD, Australian dollar</option></select></div><label class="pu-switch blk-set-sw"><span class="t"><b id="blk-ss-sw-l">Email me when an order needs review</b><small id="blk-ss-sw-h">For example, when artwork fails the print check.</small></span><input type="checkbox" role="switch" checked aria-labelledby="blk-ss-sw-l" aria-describedby="blk-ss-sw-h"></label></div><div class="pu-card-f"><button type="reset" class="pu-btn secondary sm">Cancel</button><button type="submit" class="pu-btn primary sm">Save</button></div></form></div>`,

 {id:'stats',cat:'App pages',t:'Stats row',d:'Metric cards with trend and sparkline.',free:true,html:`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%">${[['Visitors','24.8k','14%',1,[30,40,35,50,45,60,70,65,80]],['Sessions','9,412','6%',1,[40,38,45,50,48,55,52,60,64]],['Bounce rate','41%','2%',0,[60,58,62,55,57,50,52,48,45]]].map(k=>`<div class="pu-card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d"><span class="${k[3]?'up':'down'}">${k[3]?'↑':'↓'} ${k[2]}</span> this week</div><div style="margin-top:8px">${bars(k[4])}</div></div>`).join('')}</div>`,

 {id:'notifications',cat:'App pages',t:'Notification settings',d:'Settings form with switches and a sticky save bar.',html:`<div class="pu-card" style="width:560px;max-width:100%"><div class="pu-card-h"><div><h4>Notifications</h4><p>Choose what your team hears about.</p></div></div><div class="pu-card-b" style="display:flex;flex-direction:column;gap:0;padding:0">${[['New orders','Email and push for every order',1],['Low stock','When a variant drops below 5 units',1],['App updates','Release notes from ParseLab',0]].map((r,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;${i?'border-top:1px solid var(--border)':''}"><div><b style="font-weight:500;font-size:14px">${r[0]}</b><div style="font-size:13px;color:var(--text-3)">${r[1]}</div></div><label class="pu-switch"><input type="checkbox" ${r[2]?'checked':''} role="switch" aria-label="${r[0]}"></label></div>`).join('')}</div><div class="pu-card-f"><button class="pu-btn secondary sm">Reset</button><button class="pu-btn primary sm">Save changes</button></div></div>`,

 {id:'empty',cat:'App pages',t:'Empty state',d:'First-run screen that points to the next action.',free:true,html:`<div class="pu-card" style="width:520px;max-width:100%"><div class="pu-empty"><div class="feat-ic brand">${I('box','ico-lg')}</div><h4>Add your first product</h4><p>Products you create or import will appear here. Start with a template or bring in a CSV.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="pu-btn secondary">${I('upload')}Import CSV</button><button class="pu-btn primary">${I('plus')}Add product</button></div></div></div>`,

 {id:'upload',cat:'App pages',t:'File upload',d:'Drop zone with in-progress file rows.',html:`<div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px"><div class="pu-upload"><div class="feat-ic brand" style="margin:0 auto 10px;width:38px;height:38px">${I('upload')}</div><b>Click to upload</b> or drag and drop<div style="font-size:12.5px;color:var(--text-3);margin-top:4px">SVG, PNG or JPG up to 10 MB</div></div>${[['hoodie-front.png','2.4 MB',100],['mug-wrap.svg','640 KB',58]].map(f=>`<div class="pu-card" style="padding:12px 14px;display:flex;gap:12px;align-items:center"><div class="prod-thumb" style="background:var(--p-soft);color:var(--p-text)">${I('layers')}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><b style="font-weight:500">${f[0]}</b><span style="color:var(--text-3)">${f[2]}%</span></div><div style="font-size:12px;color:var(--text-3);margin-bottom:6px">${f[1]}</div><div class="pu-progress sm"><i style="width:${f[2]}%"></i></div></div></div>`).join('')}</div>`,
  code:`<FileUpload accept={["image/*"]} maxSize={10 * 1024 * 1024} onUpload={upload} />`},
 {id:'pricing',cat:'Billing',t:'Pricing plans',d:'Three-tier plan picker used on app listing pages.',html:`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;max-width:720px">${[['Starter','$0','For new stores',['1 product template','Community support']],['Growth','$29','For growing brands',['Unlimited templates','Priority support','Analytics'],1],['Scale','$99','For high volume',['Everything in Growth','Custom domain','Dedicated manager']]].map(p=>`<div class="pu-card" style="padding:20px;${p[4]?'border-color:var(--p);box-shadow:0 0 0 3px var(--ring)':''}"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-weight:600">${p[0]}</b>${p[4]?'<span class="pu-badge brand">Popular</span>':''}</div><div style="font-size:30px;font-weight:600;letter-spacing:-.03em;margin:8px 0 0">${p[1]}<small style="font-size:13px;color:var(--text-3);font-weight:400">/mo</small></div><p style="margin:0 0 14px;font-size:13px;color:var(--text-3)">${p[2]}</p><button class="pu-btn ${p[4]?'primary':'secondary'} sm full">Choose ${p[0]}</button><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:13px;color:var(--text-2)">${p[3].map(f=>`<span style="display:flex;align-items:center;gap:8px">${I('check')}${f}</span>`).join('')}</div></div>`).join('')}</div>`,
  code:`<PricingTable plans={plans} highlighted="growth" interval="monthly" />`},
 {id:'plan-usage',cat:'Billing',t:'Plan and usage',d:'Current plan, renewal date and usage meters that warn in words, not just color, before a limit is hit.',html:`<div class="pu-card blk-plan"><div class="pu-card-h"><div><p class="blk-plan-k">Current plan</p><h4>Growth · $29/month <span class="pu-badge success round"><i class="dot"></i>Active</span></h4><p class="blk-plan-r">Renews Oct 28</p></div></div><div class="pu-card-b blk-meters">${[['orders','Orders',1840,2500],['designs','Designs',38,50]].map(m=>{ const pct=Math.round(m[2]/m[3]*100), warn=pct>75; return `<div class="blk-meter${warn?' warn':''}"><div class="blk-meter-t"><b id="blk-mu-${m[0]}">${m[1]}</b><span>${m[2].toLocaleString('en-US')} / ${m[3].toLocaleString('en-US')}</span></div><div class="pu-progress" role="progressbar" aria-labelledby="blk-mu-${m[0]}" aria-valuemin="0" aria-valuemax="${m[3]}" aria-valuenow="${m[2]}" aria-valuetext="${m[2].toLocaleString('en-US')} of ${m[3].toLocaleString('en-US')} ${m[1].toLowerCase()} used, ${pct}%"><i style="width:${pct}%"></i></div><p class="blk-meter-n">${warn?`${I('alert')}${pct}% used. You're close to your limit.`:`${pct}% used this billing cycle`}</p></div>`; }).join('')}</div><div class="pu-card-f"><button type="button" class="pu-btn secondary sm">View invoices</button><button type="button" class="pu-btn primary sm">Change plan</button></div></div>`,
  code:`<PlanCard
  plan="Growth"
  price={{ amount: 29, currency: "USD", interval: "month" }}
  status="active"
  renewsAt="2026-10-28"
  actions={
    <>
      <Button variant="secondary" onClick={openInvoices}>View invoices</Button>
      <Button onClick={openPlans}>Change plan</Button>
    </>
  }
>
  <UsageMeter label="Orders" used={1840} limit={2500} />
  <UsageMeter label="Designs" used={38} limit={50} warnAt={0.75} />
</PlanCard>`}];
/* ---------- shared doc pieces ---------- */
const demo=(ex,i)=>{ const id=CODES.push(ex.code)-1;
  return `<div class="demo" data-demo><div class="demo-bar"><div class="seg" role="tablist"><button class="on" data-view="p">Preview</button><button data-view="c">Code</button></div><span class="spacer"></span>
  <div class="seg" title="Preview theme"><button class="on" data-scope="" aria-label="Page theme">${I('eye')}</button><button data-scope="scope-light" aria-label="Light preview">${I('sun')}</button><button data-scope="scope-dark" aria-label="Dark preview">${I('moon')}</button></div></div>
  <div class="preview ${ex.cls||''}" data-pv>${ex.html}</div>
  <div class="codewrap hidden" data-cv><pre class="code">${hl(ex.code)}</pre><button class="copy" data-copy="${id}" aria-label="Copy code">${I('copy')}</button></div></div>`; };
const propsTable=rows=>`<div class="props-wrap"><table class="props"><thead><tr><th>Prop</th><th>Type</th><th>Default</th><th>Description</th></tr></thead><tbody>${rows.map(r=>`<tr><td><code>${r[0]}</code></td><td class="type">${esc(r[1])}</td><td class="type">${esc(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
const pmTabs=(cmd)=>{ const v={pnpm:`pnpm dlx ${cmd}`,npm:`npx ${cmd}`,yarn:`yarn dlx ${cmd}`,bun:`bunx --bun ${cmd}`}; const id=CODES.push(v.pnpm)-1;
  return `<div class="cblock" data-pm='${JSON.stringify(v).replace(/'/g,"&#39;")}'><div class="cblock-head">${I('terminal')}Terminal<div class="seg">${Object.keys(v).map((k,i)=>`<button class="${i?'':'on'}" data-pmk="${k}">${k}</button>`).join('')}</div></div><div class="codewrap"><pre class="code">${hl(v.pnpm,'bash')}</pre><button class="copy" data-copy="${id}" aria-label="Copy command">${I('copy')}</button></div></div>`; };
const crumbs=(...a)=>`<div class="eyebrow">${a[0]}</div>`;
function pager(slug){ const i=FLAT.findIndex(f=>f.slug===slug); const p=FLAT[i-1], n=FLAT[i+1];
  return `<div class="pager">${p?`<a href="#/docs/${p.slug}">Previous<b>${p.name}</b></a>`:''}${n?`<a class="next" href="#/docs/${n.slug}">Next<b>${n.name}</b></a>`:''}</div>`; }
const statusTag=s=>s==='beta'?'<span class="pu-badge warning">Beta</span>':'<span class="pu-badge success">Stable</span>';

/* ---------- component page (the template every component follows) ---------- */
function componentPage(k){
  const c=C[k], file=k.replace(/[^a-z]/g,'');
  let h=`${crumbs('Base components',c.name)}<h1>${c.name}</h1><p class="lead">${c.desc}</p>
  <div class="meta-row">${statusTag(c.status)}<a class="chip-link" href="javascript:void 0">${I('figma')}Figma</a><a class="chip-link" href="javascript:void 0">${I('link')}Source</a>${c.radix?`<a class="chip-link" href="javascript:void 0">${I('layers')}Built on Radix ${c.radix}</a>`:''}</div>
  ${demo(c.examples[0])}
  <h2 id="installation">Installation</h2>

const BUTTON_SRC=`import * as React from "react"
import { Slot } from "@radix-ui/react-slot"
import { cva, type VariantProps } from "class-variance-authority"
import { cn } from "@/lib/utils"

const buttonVariants = cva(
  "inline-flex items-center justify-center gap-1.5 rounded-[--radius] font-medium transition-colors focus-visible:ring-2 disabled:opacity-50",
  {
    variants: {
      variant: {
        primary: "bg-primary text-primary-foreground hover:bg-primary-hover",
        secondary: "border border-strong bg-background hover:bg-subtle",
        soft: "bg-primary-soft text-primary-text",
        ghost: "hover:bg-muted",
        danger: "bg-danger text-white",
        link: "text-primary-text underline-offset-4 hover:underline",
      },
      size: { xs: "h-7 px-2.5 text-[13px]", sm: "h-8 px-3", md: "h-9 px-3.5", lg: "h-11 px-4.5" },
    },
    defaultVariants: { variant: "primary", size: "md" },
  }
)

export interface ButtonProps
  extends React.ButtonHTMLAttributes<HTMLButtonElement>,
    VariantProps<typeof buttonVariants> {
  asChild?: boolean
  loading?: boolean
  leadingIcon?: React.ReactNode
  trailingIcon?: React.ReactNode
}

export const Button = React.forwardRef<HTMLButtonElement, ButtonProps>(
  ({ className, variant, size, asChild, loading, leadingIcon, trailingIcon, children, ...props }, ref) => {
    const Comp = asChild ? Slot : "button"
    return (
      <Comp ref={ref} aria-busy={loading} disabled={loading || props.disabled}
        className={cn(buttonVariants({ variant, size }), className)} {...props}>
        {loading ? <Spinner /> : leadingIcon}
        {children}
        {trailingIcon}
      </Comp>
    )
  }
)`;

function sidebarHTML(slug){

function render(){
  CODES.length=0; const hash=location.hash.replace(/^#/,'')||'/'; const m=hash.match(/^\/docs\/([\w-]+)/);
  document.querySelectorAll('#topNav a').forEach(a=>a.classList.remove('on'));
  closeSidebar();
  if(!m){ app.innerHTML=homePage(); document.title='ParseUI — Design system by ParseLab'; window.scrollTo(0,0); applyTheme(); afterRender(); return; }
  const slug=m[1], f=FLAT.find(x=>x.slug===slug)||FLAT[0];
  const body=C[f.slug]?componentPage(f.slug):(PAGES[f.slug]||PAGES.introduction)();
  const wide=f.slug==='dashboard';
  app.innerHTML=`<div class="layout ${wide?'no-toc':''}"><aside class="sidebar" id="sidebar">${sidebarHTML(f.slug)}</aside><main class="main"><article class="doc" style="${wide?'max-width:1180px':''}">${body}</article></main>${wide?'':`<aside class="toc" id="toc"></aside>`}</div>`;
  document.querySelector(`#topNav a[data-sec="${f.sec}"]`)?.classList.add('on');
  document.title=f.name+' — ParseUI'; window.scrollTo(0,0); buildToc(); applyTheme(); afterRender();
}
function afterRender(){
  document.querySelectorAll('[data-indet]').forEach(el=>el.indeterminate=true);
  document.querySelectorAll('[data-slider]').forEach(el=>el.dispatchEvent(new Event('input',{bubbles:true})));
}
let tocObs;
function buildToc(){ const toc=document.getElementById('toc'); if(!toc) return; const hs=[...document.querySelectorAll('.doc h2[id], .doc h3[id^="ex-"]')];
  toc.innerHTML=hs.length?`<div class="toc-title">${I('toc')}On this page</div>${hs.map(h=>`<a href="javascript:void 0" class="${h.tagName==='H3'?'sub':''}" data-to="${h.id}">${h.childNodes[0].textContent.trim()}</a>`).join('')}<div class="toc-card"><b>Help shape ParseUI</b>Spotted something off? Share feedback in the #parseui channel.</div>`:'';
  tocObs?.disconnect(); tocObs=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ toc.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.to===e.target.id)); } }); },{rootMargin:'-80px 0px -70% 0px'});
  hs.forEach(h=>tocObs.observe(h)); }

/* ---------- toast + modal ---------- */
function toast(kind,title,desc,action){ const t=document.createElement('div'); t.className='pu-toast'; t.setAttribute('role','status');
  const ic={success:['checkC','var(--success-soft)','var(--success)'],error:['xC','var(--danger-soft)','var(--danger)'],info:['info','var(--p-soft)','var(--p-text)']}[kind]||['checkC','var(--success-soft)','var(--success)'];
  t.innerHTML=`<span class="ic" style="background:${ic[1]};color:${ic[2]}">${I(ic[0])}</span><div class="t"><b>${title}</b>${desc||''}${action?`<div style="margin-top:8px"><button class="pu-btn link sm">${action}</button></div>`:''}</div><button class="x" aria-label="Dismiss">${I('x')}</button>`;
  document.getElementById('toaster').appendChild(t); const kill=()=>t.remove(); t.querySelector('.x').onclick=kill; setTimeout(kill,4200); }
const MODALS={
 delete:`<div class="mb"><div class="feat-ic danger">${I('trash','ico-lg')}</div><h4>Delete this product?</h4><p>This removes “Organic cotton tee” and its 4 variants from your store. This can't be undone.</p></div><div class="mf"><button class="pu-btn secondary" data-close>Cancel</button><button class="pu-btn danger" data-close data-after="deleted">Delete product</button></div>`,
 invite:`<div class="mb"><div class="feat-ic brand">${I('users','ico-lg')}</div><h4>Invite a teammate</h4><p style="margin-bottom:16px">They'll get an email with a link to join your workspace.</p><div class="pu-field" style="max-width:none"><label class="pu-label">Email</label><div class="pu-input">${I('mail')}<input placeholder="name@parselab.com" autofocus></div></div><div class="pu-field" style="max-width:none;margin-top:12px"><label class="pu-label">Role</label><select class="pu-select"><option>Editor</option><option>Viewer</option><option>Admin</option></select></div></div><div class="mf"><button class="pu-btn secondary" data-close>Cancel</button><button class="pu-btn primary" data-close data-after="invited">Send invite</button></div>`};
let lastFocus;
function openModal(k){ lastFocus=document.activeElement; overlay.innerHTML=`<div class="pu-modal-back" data-back><div class="pu-modal" role="dialog" aria-modal="true">${MODALS[k]}</div></div>`;
  setTimeout(()=>overlay.querySelector('.pu-modal button:not([data-close]), .pu-modal input, .pu-modal button')?.focus(),30); }
function closeOverlay(){ overlay.innerHTML=''; lastFocus?.focus?.(); }

/* ---------- command palette ---------- */
let cmdSel=0;
function openCmd(){ overlay.innerHTML=`<div class="cmdk-back" data-back><div class="cmdk" role="dialog" aria-label="Search"><div class="cmdk-in">${I('search','ico-lg')}<input id="cmdIn" placeholder="Search components, foundations, blocks" autocomplete="off"><span class="kbd">Esc</span></div><div class="cmdk-list" id="cmdList"></div><div class="cmdk-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span>Navigate</span><span><span class="kbd">↵</span>Open</span></div></div></div>`;
  const inp=document.getElementById('cmdIn'); inp.focus(); cmdSel=0; drawCmd(''); inp.oninput=()=>{ cmdSel=0; drawCmd(inp.value); }; }
function cmdItems(q){ q=q.toLowerCase().trim(); return FLAT.filter(f=>!q||f.name.toLowerCase().includes(q)||f.group.toLowerCase().includes(q)); }
function drawCmd(q){ const items=cmdItems(q), list=document.getElementById('cmdList'); if(!list) return;
  if(!items.length){ list.innerHTML=`<div class="cmdk-empty">No results for “${esc(q)}”. Try “button” or “colors”.</div>`; return; }
  let g='',h='',i=0; items.forEach(it=>{ if(it.group!==g){ g=it.group; h+=`<div class="cmdk-g">${g}</div>`; } h+=`<div class="cmdk-i ${i===cmdSel?'on':''}" data-go="${it.slug}" data-idx="${i}">${I(it.icon||'box')}${it.name}</div>`; i++; });
  list.innerHTML=h; list.querySelector('.cmdk-i.on')?.scrollIntoView({block:'nearest'}); }

/* ---------- customizer ---------- */
function openCust(){ overlay.innerHTML=`<div class="drawer-back" data-back style="background:transparent"></div><div class="pop" role="dialog" aria-label="Customize theme"><h4>Customize</h4><p>Preview ParseUI with a different brand. Saved in this browser.</p>
  <div class="lbl">Brand color</div>${swatches()}
  <div class="lbl">Radius</div><div class="opt-row r6">${['0','4','6','8','10','12'].map(r=>`<button class="opt" data-radius="${r}">${r}</button>`).join('')}</div>
  <div class="lbl">Mode</div><div class="opt-row">${[['light','sun','Light'],['dark','moon','Dark'],['system','sliders','System']].map(m=>`<button class="opt" data-mode="${m[0]}">${I(m[1])}${m[2]}</button>`).join('')}</div>
  <div style="margin-top:16px;display:flex;gap:8px"><button class="pu-btn secondary sm" data-reset style="flex:1">Reset</button><button class="pu-btn primary sm" data-copytheme style="flex:1">${I('copy')}Copy CSS</button></div></div>`; applyTheme(); }

/* ---------- sidebar (mobile) ---------- */
function closeSidebar(){ document.getElementById('sidebar')?.classList.remove('open'); document.getElementById('sbBack')?.remove(); }

/* ---------- block interactions ---------- */
function setupOpen(g,li){ g.querySelectorAll('.blk-task').forEach(x=>{ const on=x===li; x.classList.toggle('open',on); x.querySelector('[data-task-t]').setAttribute('aria-expanded',on); x.querySelector('.blk-task-b').classList.toggle('hidden',!on); }); }
function setupNext(li){ const g=li.closest('[data-setup]'), all=[...g.querySelectorAll('.blk-task')], i=all.indexOf(li);
  const n=[...all.slice(i+1),...all.slice(0,i)].find(x=>!x.classList.contains('done'))||null; setupOpen(g,n); (n||li).querySelector('[data-task-t]').focus(); }
function setupDone(li){ const g=li.closest('[data-setup]'), n=g.querySelectorAll('.blk-task').length; li.classList.add('done'); li.querySelector('.blk-task-ic').innerHTML=I('checkC')+'<span class="blk-sr">Completed: </span>'; li.querySelector('.blk-task-acts')?.remove();
  const d=g.querySelectorAll('.blk-task.done').length, bar=g.querySelector('[role="progressbar"]'); bar.setAttribute('aria-valuenow',d); bar.querySelector('i').style.width=d/n*100+'%';
  g.querySelector('[data-setup-count]').textContent=d===n?'All tasks complete':`${d} of ${n} tasks complete`; setupNext(li); }
const rlRows=w=>[...w.querySelectorAll('tr[data-row]')];
function rlSync(w){ const vis=rlRows(w).filter(r=>!r.classList.contains('hidden')), n=vis.filter(r=>r.querySelector('input').checked).length, all=w.querySelector('[data-rl-all]');
  all.checked=n>0&&n===vis.length; all.indeterminate=n>0&&n<vis.length; all.disabled=!vis.length;
  w.querySelector('[data-rl-count]').textContent=`${n} selected`; w.querySelector('[data-rl-live]').textContent=n?`${n} selected`:'';
  w.querySelector('[data-rl-tools]').classList.toggle('hidden',n>0); w.querySelector('[data-rl-bulk]').classList.toggle('hidden',!n); }
function rlApply(w){ const q=w.querySelector('[data-rl-q]').value.trim().toLowerCase(), active=!!w.querySelector('[data-rl-chip]'), tb=w.querySelector('tbody'), empty=tb.querySelector('[data-rl-empty]');
  const cmp={name:(a,b)=>a.dataset.name.localeCompare(b.dataset.name),'price-asc':(a,b)=>a.dataset.price-b.dataset.price,'price-desc':(a,b)=>b.dataset.price-a.dataset.price,inv:(a,b)=>a.dataset.inv-b.dataset.inv}[w.querySelector('[data-rl-sort]').value];
  let shown=0; rlRows(w).sort(cmp).forEach(r=>{ tb.insertBefore(r,empty); const hit=(!active||r.dataset.status==='active')&&(!q||r.dataset.name.toLowerCase().includes(q)); r.classList.toggle('hidden',!hit); if(hit) shown++; else r.querySelector('input').checked=false; });
  empty.classList.toggle('hidden',shown>0); rlSync(w); }
function rlBulk(w,act){ const sel=rlRows(w).filter(r=>r.querySelector('input').checked), n=sel.length;
  sel.forEach(r=>{ if(act==='delete'){ r.remove(); return; } r.dataset.status='archived'; r.querySelector('.pu-badge').outerHTML='<span class="pu-badge gray round"><i class="dot"></i>Archived</span>'; r.querySelector('input').checked=false; });
  rlApply(w); const all=w.querySelector('[data-rl-all]'); (all.disabled?w.querySelector('[data-rl-q]'):all).focus(); toast('success',`${n} ${n===1?'product':'products'} ${act==='delete'?'deleted':'archived'}`); }
function setupHide(g,hide){ g.querySelector('[data-setup-body]').classList.toggle('hidden',hide); g.querySelector('[data-setup-min]').classList.toggle('hidden',!hide); g.querySelector(hide?'[data-setup-show]':'[data-setup-x]').focus(); }

/* ---------- global events ---------- */
async function copyText(t,label='Copied to clipboard'){ try{ await navigator.clipboard.writeText(t); }catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); } toast('success',label); }
document.addEventListener('click',e=>{
  const t=e.target.closest('button, a, [data-go], [data-back], .swatch-cell'); if(!t) return;
  if(t.dataset.back!==undefined && e.target===t){ closeOverlay(); return; }
  if(t.dataset.copy!==undefined){ copyText(CODES[+t.dataset.copy]); const o=t.innerHTML; t.innerHTML=I('check'); setTimeout(()=>t.innerHTML=o,1400); return; }
  if(t.dataset.copytext){ const v=t.dataset.copytext.replace(/&quot;/g,'"'); copyText(v, t.dataset.copylabel||'Copied '+v.slice(0,40)); return; }
  if(t.dataset.brand){ state.brand=t.dataset.brand; store.set('brand',state.brand); applyTheme(); return; }
  if(t.dataset.radius){ state.radius=t.dataset.radius; store.set('radius',state.radius); applyTheme(); return; }
  if(t.dataset.mode){ state.theme=t.dataset.mode; store.set('theme',state.theme); applyTheme(); return; }
  if(t.dataset.reset!==undefined){ Object.assign(state,{brand:'parse',radius:'8',theme:'system'}); ['brand','radius','theme'].forEach(k=>store.set(k,state[k])); applyTheme(); return; }
  if(t.dataset.copytheme!==undefined){ const b=BRANDS.find(x=>x.id===state.brand); copyText(`:root {\n  --brand: ${b.c||'var(--text)'};\n  --brand-fg: ${b.c?'#ffffff':'var(--bg)'};\n  --radius: ${state.radius}px;\n}`,'Theme CSS copied'); return; }
  if(t.dataset.view){ const d=t.closest('[data-demo]'); t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); d.querySelector('[data-pv]').classList.toggle('hidden',t.dataset.view!=='p'); d.querySelector('[data-cv]').classList.toggle('hidden',t.dataset.view!=='c'); return; }
  if(t.dataset.scope!==undefined){ const d=t.closest('[data-demo]'); t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); const pv=d.querySelector('[data-pv]'); pv.classList.remove('scope-light','scope-dark'); if(t.dataset.scope) pv.classList.add(t.dataset.scope); return; }
  if(t.dataset.pmk){ const blk=t.closest('[data-pm]'), v=JSON.parse(blk.dataset.pm); t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); blk.querySelector('pre').innerHTML=hl(v[t.dataset.pmk],'bash'); CODES[+blk.querySelector('.copy').dataset.copy]=v[t.dataset.pmk]; return; }
  if(t.dataset.instT){ const w=t.closest('[data-inst]'); w.querySelectorAll('[data-inst-t]').forEach(b=>b.classList.toggle('on',b===t)); w.querySelectorAll('[data-inst-p]').forEach(p=>p.classList.toggle('hidden',p.dataset.instP!==t.dataset.instT)); return; }
  if(t.dataset.i!==undefined && t.closest('[data-tabs]')){ const w=t.closest('[data-tabs]'); t.parentNode.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b===t); if(b.getAttribute('role')==='tab'){ b.setAttribute('aria-selected',b===t); b.tabIndex=b===t?0:-1; } }); w.querySelectorAll('[data-p]').forEach(p=>p.classList.toggle('hidden',p.dataset.p!==t.dataset.i)); return; }
  if(t.closest('[data-group]')){ t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(t.closest('[data-pag]') && !t.getAttribute('aria-label') && !t.disabled){ t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(t.dataset.taskT!==undefined){ const li=t.closest('.blk-task'); setupOpen(li.closest('[data-setup]'), li.classList.contains('open')?null:li); return; }
  if(t.dataset.taskDo!==undefined){ setupDone(t.closest('.blk-task')); return; }
  if(t.dataset.taskSkip!==undefined){ setupNext(t.closest('.blk-task')); return; }
  if(t.dataset.setupX!==undefined||t.dataset.setupShow!==undefined){ setupHide(t.closest('[data-setup]'), t.dataset.setupX!==undefined); return; }
  if(t.dataset.rlUnchip!==undefined){ const w=t.closest('[data-rl]'); t.closest('[data-rl-chip]').remove(); rlApply(w); w.querySelector('[data-rl-q]').focus(); return; }
  if(t.dataset.rlArchive!==undefined||t.dataset.rlDelete!==undefined){ rlBulk(t.closest('[data-rl]'), t.dataset.rlDelete!==undefined?'delete':'archive'); return; }
  if(t.dataset.modal){ openModal(t.dataset.modal); return; }
  if(t.dataset.close!==undefined){ const a=t.dataset.after; closeOverlay(); if(a==='deleted') toast('success','Product deleted','“Organic cotton tee” was removed.','Undo'); if(a==='invited') toast('success','Invite sent','They\'ll get an email shortly.'); return; }
  if(t.dataset.toast){ const k=t.dataset.toast; if(k==='success') toast('success','Product saved','Your changes are live on the storefront.'); else if(k==='error') toast('error','Sync failed','Check your API key in Settings and try again.'); else toast('info','Order archived','#1284 moved to archive.','Undo'); return; }
  if(t.dataset.demoClick!==undefined){ const o=t.innerHTML; t.innerHTML=I('loader','spin')+'Loading'; t.disabled=true; t.setAttribute('aria-busy','true'); setTimeout(()=>{ t.innerHTML=o; t.disabled=false; t.removeAttribute('aria-busy'); toast('success','Done','Loading state finished.'); },1600); return; }
  if(t.dataset.go){ closeOverlay(); location.hash='#/docs/'+t.dataset.go; return; }
  if(t.dataset.to){ document.getElementById(t.dataset.to)?.scrollIntoView({behavior:'smooth'}); return; }
  if(t.id==='searchBtn'){ openCmd(); return; }
  if(t.id==='custBtn'){ overlay.querySelector('.pop')?closeOverlay():openCust(); return; }
  if(t.id==='themeBtn'){ state.theme=isDark()?'light':'dark'; store.set('theme',state.theme); applyTheme(); return; }
  if(t.id==='menuBtn'){ const sb=document.getElementById('sidebar'); if(!sb) { location.hash='#/docs/introduction'; return; } sb.classList.add('open'); const b=document.createElement('div'); b.className='drawer-back'; b.id='sbBack'; b.onclick=closeSidebar; document.body.appendChild(b); return; }
  if(t.matches('a[href^="javascript"]')) e.preventDefault();
});
document.addEventListener('input',e=>{ if(e.target.matches('[data-slider], .pu-slider')){ const el=e.target, v=(el.value-el.min)/(el.max-el.min)*100; el.style.setProperty('--v',v+'%'); const o=el.closest('.pu-field')?.querySelector('[data-sl-out]'); if(o) o.textContent=Math.round(el.value)+'%'; } });
document.addEventListener('keydown',e=>{
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.matches('[role="tab"]')){ const tabs=[...e.target.parentNode.querySelectorAll('[role="tab"]')], n=tabs[(tabs.indexOf(e.target)+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length]; e.preventDefault(); n.focus(); n.click(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); overlay.querySelector('.cmdk')?closeOverlay():openCmd(); return; }
  if(e.key==='Escape'&&overlay.innerHTML){ closeOverlay(); return; }
  if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)&&!overlay.innerHTML){ e.preventDefault(); openCmd(); return; }
  const list=document.getElementById('cmdList'); if(list&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){ const items=cmdItems(document.getElementById('cmdIn').value); if(!items.length) return;
    if(e.key==='Enter'){ const it=items[cmdSel]; closeOverlay(); location.hash='#/docs/'+it.slug; return; }
    e.preventDefault(); cmdSel=(cmdSel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; drawCmd(document.getElementById('cmdIn').value); }
});
document.addEventListener('mouseover',e=>{ const it=e.target.closest('.cmdk-i'); if(it&&+it.dataset.idx!==cmdSel){ cmdSel=+it.dataset.idx; document.querySelectorAll('.cmdk-i').forEach(x=>x.classList.toggle('on',x===it)); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>state.theme==='system'&&applyTheme());
document.addEventListener('input',e=>{ if(!e.target.matches('[data-icon-search]')) return;
  const q=e.target.value.trim().toLowerCase(), items=[...document.querySelectorAll('[data-icon-name]')]; let n=0;
  items.forEach(el=>{ const hit=!q||el.dataset.iconName.includes(q); el.hidden=!hit; if(hit) n++; });
  document.querySelector('[data-icon-count]').textContent=q?`${n} of ${items.length} icons`:`${items.length} icons`;
  document.querySelector('[data-icon-empty]').hidden=n>0; });
document.addEventListener('change',e=>{ const w=e.target.closest('[data-rl]'); if(!w) return;
  if(e.target.matches('[data-rl-sort]')){ rlApply(w); return; }
  if(e.target.matches('[data-rl-all]')) rlRows(w).forEach(r=>{ if(!r.classList.contains('hidden')) r.querySelector('input').checked=e.target.checked; });
  if(e.target.type==='checkbox') rlSync(w); });
document.addEventListener('input',e=>{ if(e.target.matches('[data-rl-q]')) rlApply(e.target.closest('[data-rl]')); });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-blk-form]'); if(!f) return; e.preventDefault(); toast('success',f.dataset.blkForm); });
window.addEventListener('hashchange',render);
render();
</script>
